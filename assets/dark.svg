<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
      .text { font-family: 'Fira Code', monospace; }
      .pill { transition: all 0.3s ease; cursor: pointer; }
      .pill:hover { transform: scale(1.05) translateY(-2px); }
      .pill:hover rect { fill: rgba(34, 211, 238, 0.15); stroke: #22D3EE; filter: drop-shadow(0 0 8px rgba(34,211,238,0.6)); }
      .icon:hover { fill: #22D3EE; filter: drop-shadow(0 0 6px #22D3EE); transition: 0.3s; }
    </style>
    
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" rx="20" fill="url(#bg-grad)" />
  <rect width="1180" height="610" fill="url(#glow)" />
  
  <!-- Floating Particles -->
  <g fill="#22D3EE" opacity="0.4">
    <circle cx="100" cy="500" r="2"><animateMotion path="M0,0 Q30,-50 0,-100 T0,-200" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="550" r="1.5"><animateMotion path="M0,0 Q-40,-60 10,-150 T20,-300" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="580" r="2.5"><animateMotion path="M0,0 Q50,-80 -20,-180 T10,-350" dur="18s" repeatCount="indefinite"/></circle>
  </g>

<!-- LEFT PANEL (ASCII Art 38%) -->
  <rect x="25" y="25" width="430" height="560" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#glass-blur)" />
  <g transform="translate(240, 80)" fill="url(#accent-grad)" font-size="12" font-weight="600" class="text" letter-spacing="2" text-anchor="middle" xml:space="preserve">
    <!-- ASCII Floating Animation -->
    <animateTransform attributeName="transform" type="translate" values="240,80; 240,75; 240,80" dur="6s" repeatCount="indefinite"/>
    
    <text y="20">      .::::::::...       </text>
    <text y="40">   .::::.......::::.     </text>
    <text y="60">  .::.           .::.    </text>
    <text y="80"> .::               ::.   </text>
    <text y="100"> ::    _       _    ::   </text>
    <text y="120"> ::   /#\     /#\   ::   </text>
    <text y="140"> ::   \+/     \+/   ::   </text>
    <text y="160"> ::                 ::   </text>
    <text y="180"> .::      ___      ::.   </text>
    <text y="200">  .::.  \_____/  .::.    </text>
    <text y="220">   .::::.......::::.     </text>
    <text y="240">      .::::::::...       </text>
    <text y="260">      _.-"""""-._        </text>
    <text y="280">    .'           '.      </text>
    <text y="300">   /               \     </text>
    <text y="320">  |     SYSTEM      |    </text>
    <text y="340">  |   OPTIMIZED     |    </text>
    <text y="360">  \                 /    </text>
    <text y="380">   '._           _.'     </text>
    <text y="400">      '-._____.-'        </text>
    
    <!-- Sequential Reveal for ASCII -->
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze" />
  </g>
  
  <!-- Scanline Effect -->
  <rect x="25" y="25" width="430" height="4" fill="url(#accent-grad)" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,556" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- RIGHT PANEL (Terminal 62%) -->
  <rect x="475" y="25" width="680" height="560" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#glass-blur)" />
  
  <!-- Mac Window Dots -->
  <circle cx="505" cy="50" r="6" fill="#EF4444" />
  <circle cx="525" cy="50" r="6" fill="#F59E0B" />
  <circle cx="545" cy="50" r="6" fill="#10B981" />

  <g class="text" transform="translate(505, 110)">
    <!-- Greeting -->
    <text x="0" y="0" font-size="32" font-weight="600" fill="#F8FAFC">Hi, I'm Anant Bhardwaj</text>
    
    <!-- Animated Typing Roles -->
    <g font-size="22" font-weight="600" fill="url(#accent-grad)">
      <text x="0" y="45" opacity="0">
        > Software Engineer_
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.25;0.3;0.5;0.75;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="45" opacity="0">
        > ML Engineer_
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.25;0.3;0.5;0.55;0.75;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="45" opacity="0">
        > Full Stack Developer_
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.5;0.55;0.75;0.8;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Sequential Reveal Details -->
    <g font-size="16" fill="#94A3B8" font-weight="400">
      <g opacity="0"><text x="0" y="100"><tspan fill="#22D3EE">const</tspan> location = "Imphal, India";</text><animate attributeName="opacity" to="1" dur="0.5s" begin="0.5s" fill="freeze"/></g>
      <g opacity="0"><text x="0" y="130"><tspan fill="#22D3EE">const</tspan> education = "B.Tech CS @ IIIT Manipur";</text><animate attributeName="opacity" to="1" dur="0.5s" begin="1.0s" fill="freeze"/></g>
      <g opacity="0"><text x="0" y="160"><tspan fill="#22D3EE">const</tspan> focus = "Building Scalable Systems &amp; GenAI";</text><animate attributeName="opacity" to="1" dur="0.5s" begin="1.5s" fill="freeze"/></g>
      <g opacity="0"><text x="0" y="190"><tspan fill="#22D3EE">const</tspan> portfolio = "anantmob.netlify.app";</text><animate attributeName="opacity" to="1" dur="0.5s" begin="2.0s" fill="freeze"/></g>
      <g opacity="0"><text x="0" y="220"><tspan fill="#22D3EE">const</tspan> email = "anantxbth@gmail.com";</text><animate attributeName="opacity" to="1" dur="0.5s" begin="2.5s" fill="freeze"/></g>
    </g>

    <!-- Skills Section -->
    <g transform="translate(0, 270)" opacity="0">
      <animate attributeName="opacity" to="1" dur="1s" begin="3.0s" fill="freeze" />
      <text x="0" y="0" font-size="14" fill="#F8FAFC" font-weight="600">// CORE TECHNOLOGIES</text>
      
      <!-- Row 1 -->
      <g class="pill" transform="translate(0, 20)">
        <rect width="60" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="30" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">C++</text>
      </g>
      <g class="pill" transform="translate(75, 20)">
        <rect width="85" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="42.5" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">Python</text>
      </g>
      <g class="pill" transform="translate(175, 20)">
        <rect width="120" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="60" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">JavaScript</text>
      </g>
      <g class="pill" transform="translate(310, 20)">
        <rect width="115" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="57.5" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">PostgreSQL</text>
      </g>

      <!-- Row 2 -->
      <g class="pill" transform="translate(0, 65)">
        <rect width="90" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="45" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">Next.js</text>
      </g>
      <g class="pill" transform="translate(105, 65)">
        <rect width="95" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="47.5" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">React.js</text>
      </g>
      <g class="pill" transform="translate(215, 65)">
        <rect width="90" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="45" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">FastAPI</text>
      </g>
      <g class="pill" transform="translate(320, 65)">
        <rect width="80" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="40" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">Redis</text>
      </g>
      
      <!-- Row 3 -->
      <g class="pill" transform="translate(0, 110)">
        <rect width="160" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="80" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">Machine Learning</text>
      </g>
      <g class="pill" transform="translate(175, 110)">
        <rect width="85" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="42.5" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">Gemini</text>
      </g>
      <g class="pill" transform="translate(275, 110)">
        <rect width="60" height="32" rx="16" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
        <text x="30" y="20" font-size="14" fill="#F8FAFC" text-anchor="middle">Git</text>
      </g>
    </g>
    
    <!-- Social Icons -->
    <g transform="translate(0, 440)" opacity="0">
      <animate attributeName="opacity" to="1" dur="1s" begin="3.5s" fill="freeze" />
      <a href="https://github.com/Mobx01" target="_blank">
        <path class="icon" fill="#94A3B8" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" transform="scale(1.3)"/>
      </a>
      <a href="https://linkedin.com/in/anant-bhardwaj-390b86312" target="_blank">
        <path class="icon" fill="#94A3B8" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" transform="translate(60, 0) scale(1.3)"/>
      </a>
    </g>
  </g>
</svg>
